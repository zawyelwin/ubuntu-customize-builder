name: PR build comment

on:
  workflow_run:
    workflows: ["Build custom ISO"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });

            const marker = artifacts.find(a => /^pr-\d+$/.test(a.name));
            if (!marker) {
              core.info("no PR marker artifact found, skipping comment");
              return;
            }
            const prNumber = Number(marker.name.slice(3));
            const sha = run.head_sha.slice(0, 7);
            const isos = artifacts.filter(a => a.name.startsWith("custom-iso"));

            let body;
            if (run.conclusion === "success" && isos.length > 0) {
              const lines = isos.map(a => {
                const sizeMB = Math.round(a.size_in_bytes / (1024 * 1024));
                const dl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}/artifacts/${a.id}`;
                return `- **[${a.name}](${dl})** — ~${sizeMB} MB zipped`;
              });
              body = [
                `### :white_check_mark: ISO build succeeded for \`${sha}\``,
                "",
                ...lines,
                "",
                "Unzip the artifact to get the .iso. You must be signed in to GitHub",
                "to download; artifacts expire in 14 days. Use the arm64 image for",
                "Apple Silicon VMs (VMware Fusion, UTM, Parallels).",
                `[Build log](${run.html_url})`,
              ].join("\n");
            } else {
              body = [
                `### :x: ISO build failed for \`${sha}\``,
                "",
                `See the [build log](${run.html_url}) for details.`,
              ].join("\n");
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
