name: Build custom ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record PR number
        if: github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload PR marker
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}
          path: pr-number.txt
          retention-days: 1

      - name: Lint scripts
        run: shellcheck -x -S warning build.sh scripts/*.sh scripts/lib/common.sh

      - name: Validate config and assets
        run: |
          sudo apt-get update
          ./scripts/validate.sh --online

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build arch matrix from branding.yaml
        id: matrix
        run: |
          get() {
            grep -E "^$1:" branding.yaml | head -1 \
              | sed -E 's/^[^:]+:[[:space:]]*//; s/^"([^"]*)".*$/\1/; s/[[:space:]]*#.*$//; s/[[:space:]]+$//' || true
          }
          AMD64_URL=$(get base_iso_url)
          ARM64_URL=$(get base_iso_url_arm64)
          MATRIX='{"include":[{"arch":"amd64","runner":"ubuntu-latest","url":"'"$AMD64_URL"'"}'
          if [[ -n "$ARM64_URL" ]]; then
            MATRIX+=',{"arch":"arm64","runner":"ubuntu-24.04-arm","url":"'"$ARM64_URL"'"}'
          fi
          MATRIX+=']}'
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: [validate, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          df -h

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso rsync imagemagick
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | \
            sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt-get update
          sudo apt-get install -y gum

      - name: Download base ISO
        run: curl -fL --retry 3 -o base.iso "${{ matrix.url }}"

      - name: Run build pipeline
        run: |
          WORK_DIR=/mnt/livecd-build
          AVAIL=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          if [[ "${AVAIL:-0}" -lt 25 ]]; then
            WORK_DIR="$RUNNER_TEMP/livecd-build"
          fi
          sudo env WORK_DIR="$WORK_DIR" ./build.sh --iso base.iso --out custom.iso --yes

      - name: Upload built ISO
        uses: actions/upload-artifact@v4
        with:
          name: custom-iso-${{ matrix.arch }}
          path: custom.iso
          retention-days: 14
